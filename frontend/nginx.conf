server {
    listen 80;
    root /usr/share/nginx/html;

    # API and live stream go to the FastAPI service on the same origin, so the session cookie works
    # without CORS. Buffering is off so Server-Sent Events reach the browser immediately.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Single-page app: unknown paths serve index.html and the Vue router takes over.
    location / {
        try_files $uri /index.html;
    }
}
